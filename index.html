<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EcoGuard SDU</title>
<meta name="description" content="Scan once. Know your mold risk. Get one simple action. A mold and humidity helper for Hong Kong homes.">
<meta name="theme-color" content="#141233">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EcoGuard">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><canvas id="skyCanvas"></canvas></div>
<div class="app">
  <header class="top">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4l22 8v17c0 15-9.5 26-22 31C19.5 55 10 44 10 29V12z" fill="#2EC4B6"/><path d="M32 16s-10 11-10 18a10 10 0 0 0 20 0c0-7-10-18-10-18z" fill="#141233"/><path d="M28 36c1 3 3 4.5 6 4.5" stroke="#2EC4B6" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
    <div class="brand">EcoGuard SDU<small id="tagline">Scan once. Breathe easier.</small></div>
    <button class="lang-btn" id="langBtn" aria-label="Switch language">中文</button>
  </header>
  <main id="main" aria-live="polite"></main>
</div>
<div class="tabs"><nav aria-label="Main">
  <button data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
  <button data-view="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/><path d="M9.5 14.5l2 2 3.5-4"/></svg><span>Check-in</span></button>
  <button data-view="scan" class="scan-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="3.5"/></svg><span>Scan</span></button>
  <button data-view="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Dry days</span></button>
  <button data-view="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>More</span></button>
</nav></div>
<script src="js/i18n.js"></script>
<script src="js/i18n2.js"></script>
<script src="js/rules.js"></script>
<script src="js/weather.js"></script>
<script src="js/scan.js"></script>
<script src="js/app.js"></script>
</body>
</html>
